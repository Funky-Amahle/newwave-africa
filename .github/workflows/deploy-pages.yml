name: Build and deploy NewWave Africa Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate approved brand and browser icon
        run: node --test tests/brand.test.mjs
      - name: Validate discovery and editorial UI contracts
        run: node --experimental-strip-types --test tests/discovery.test.mjs
      - name: Reproduce pinned discovery validation benchmark (synthetic-only)
        run: node --experimental-strip-types newwave_discovery_benchmark.mjs --out /tmp/newwave-validation-evidence
      - name: Validate featured fictional story and reader isolation (offline)
        run: node --experimental-strip-types --test tests/flagship-story.test.mjs
      - name: Validate reader clarity and why-this-story explanations (offline)
        run: node --experimental-strip-types --test tests/story-reading-and-why.test.mjs
      - name: Validate story and homepage translation handoffs (offline)
        run: node --experimental-strip-types --test tests/translation.test.mjs tests/homepage-language.test.mjs
      - name: Validate complementary creator links and prompt progress
        run: node --experimental-strip-types --test tests/creator-fusion.test.mjs tests/creator-input.test.mjs tests/creator-voices.test.mjs tests/creator-audio.test.mjs
      - name: Validate Creator Studio compact wayfinding and section targets (offline)
        run: node --test tests/creator-scroll-navigation.test.mjs
      - name: Validate Base44-inspired carousel and animation safety (offline)
        run: node --experimental-strip-types --test tests/base44-motion-fusion.test.mjs
      - name: Validate recording studio modes and reduced-motion behavior (offline)
        run: node --experimental-strip-types --test tests/recording-studio.test.mjs
      - name: Validate shared narration loading and playback ownership
        run: node --experimental-strip-types --test tests/narration.test.mjs
      - name: Validate private dual-provider voice pilot (offline)
        run: node --experimental-strip-types --test tests/addis-voice.test.mjs
      - name: Validate protected and session-key transcription contracts (offline)
        run: node --experimental-strip-types --test tests/transcription.test.mjs tests/session-transcription.test.mjs
      - name: Validate Deepgram narration segmentation (offline)
        run: python3 -m unittest discover -s tests -p 'test_deepgram_narration.py'
      - name: Validate all eight bundled Haley story recordings
        run: python3 scripts/validate_site_audio.py --directory public/narration --sample all --voice flux-haley-en
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Validate exported page routes and asset paths
        run: node scripts/check_pages_routes.mjs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          GITHUB_PAGES: 'false'
      - name: Check standalone server startup without provider secrets
        run: node scripts/check_server_start.mjs
  browser-qa:
    # Headless Chromium exercises rendered, hydrated UI against the exact static Pages basePath.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Build GitHub Pages export for browser QA
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Install temporary Playwright browser test runner
        run: |
          npm install --no-save --package-lock=false playwright axe-core
          npx playwright install --with-deps chromium
      - name: Run Creator Studio visual navigation and download tests
        run: |
          mkdir -p .qa-site
          ln -s "$GITHUB_WORKSPACE/out" .qa-site/newwave-africa
          python3 -m http.server 4173 --bind 127.0.0.1 --directory .qa-site >/tmp/newwave-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node scripts/qa/creator-visuals-smoke.mjs
          node scripts/qa/accessibility-smoke.mjs
      - name: Upload browser screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: creator-studio-browser-and-accessibility-qa-failure
          path: browser-qa-artifacts/
          if-no-files-found: ignore
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, server-build]
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
