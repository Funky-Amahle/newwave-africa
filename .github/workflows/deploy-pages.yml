name: Build and deploy NewWave Africa Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate approved brand and browser icon
        run: node --test tests/brand.test.mjs
      - name: Validate discovery and editorial UI contracts
        run: node --experimental-strip-types --test tests/discovery.test.mjs
      - name: Validate shared narration loading and playback ownership
        run: node --experimental-strip-types --test tests/narration.test.mjs
      - name: Validate Deepgram narration segmentation (offline)
        run: python3 -m unittest discover -s tests -p 'test_deepgram_narration.py'
      - name: Validate all eight bundled Haley story recordings
        run: python3 scripts/validate_site_audio.py --directory public/narration --sample all --voice flux-haley-en
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
